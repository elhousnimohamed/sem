# gateway.yaml - Claude apps gateway (claude gateway --config <ce fichier>)
# Valeurs entre <chevrons> : a remplacer. Secrets via ${VAR} ou ${file:/chemin}.

listen:
  host: 0.0.0.0
  port: 8080
  public_url: "https://<GATEWAY_HOSTNAME>"
  # trusted_proxies: ["<CIDR_ROUTEUR_OPENSHIFT>"]

oidc:
  issuer: "<OIDC_ISSUER_URL>"
  client_id: "<OIDC_CLIENT_ID>"
  token_endpoint_auth_method: private_key_jwt
  client_assertion:
    private_key_pem: ${file:/etc/gateway/oidc/idp-client.key}
    certificate_pem: ${file:/etc/gateway/oidc/idp-client.crt}
  allowed_email_domains:
    - "<EMAIL_DOMAIN>"
  # Allowlist d'emails : le claim email est lu comme "groupe", donc seuls les
  # emails listés ici peuvent se connecter. Casse exacte (comme dans l'id_token).
  # Si l'IdP met l'email dans un autre claim (upn, preferred_username), changer
  # groups_claim ET email_claim. Redémarrer la gateway après chaque modification.
  groups_claim: email
  allowed_groups:
    - "prenom1.nom1@<EMAIL_DOMAIN>"
    - "prenom2.nom2@<EMAIL_DOMAIN>"
  # use_proxy: true

session:
  jwt_secret: ${GATEWAY_JWT_SECRET}

store:
  postgres_url: ${GATEWAY_POSTGRES_URL}

upstreams:
  - provider: bedrock
    region: "<AWS_REGION>"
    auth: {}
    # base_url: "https://<VPCE_BEDROCK_RUNTIME_DNS>"

auto_include_builtin_models: true
# models:
#   - id: <MODEL_ID>
#     label: <LABEL>
#     upstream_model:
#       bedrock: <INFERENCE_PROFILE_ID_OR_ARN>

managed:
  policies:
    - match: {}
      cli:
        allowManagedHooksOnly: true
        allowManagedPermissionRulesOnly: true
        cleanupPeriodDays: 30
        companyAnnouncements:
          - 'Corporate policy: Claude Code is approved for internal development only. Do not paste customer data, PII, or production secrets. Bypass mode is disabled. Security contact: mathieu.payet@axa.com. GO CloudBrokers: ikram.bejaoui@axa.com, mohamed.elhousni@axa.com. Leaddev: mohammed.jennane@axa.com. PO: marvin.kraus@axa.com | Full policy: https://wiki.corp.internal/ai/claude-code'
        disableAllHooks: true
        env:
          BASH_DEFAULT_TIMEOUT_MS: '120000'
          BASH_MAX_TIMEOUT_MS: '600000'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          CLAUDE_CODE_ENABLE_TELEMETRY: '1'
          MAX_THINKING_TOKENS: '32000'
          MCP_TIMEOUT: '60000'
