telemetry:
  forward_to:
    - url: https://monitoring.<region>.amazonaws.com
      headers:
        Authorization: "Bearer ${CW_API_KEY}"
      metrics: true
      logs: false
      traces: false
  resource_attributes:        # optional, needs gateway v2.1.281+
    organization: <org>
    environment: prod
env:
  - name: CW_API_KEY
    valueFrom:
      secretKeyRef: {name: cw-otlp, key: CW_API_KEY}

curl -i -X POST "https://monitoring.<region>.amazonaws.com/v1/metrics" \
  -H "Content-Type: application/json" \
  -H "Authorization: Bearer <secret>" \
  -d '{"resourceMetrics":[]}'
